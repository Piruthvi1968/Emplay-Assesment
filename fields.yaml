# The 20 extraction fields. The code only loops over this file; add/edit fields here, not in code.
# Types: text, datetime, list, contact, summary. judge: true = free-text field checked by the LLM judge.
groups:
  overview_dates: "Overview & dates"
  commercial_legal: "Commercial & legal"
  product_specs: "Product & specs"
  summary: "Generated summary"

fields:
  - name: Bid Number
    group: overview_dates
    type: text
    question: "What is the bid's official solicitation identifier on the main solicitation document? If several appear, prefer a lettered solicitation code (e.g. 'AB-123456', a PORFP number) over a purely numeric sourcing-system number, and the main document's identifier over portal or project reference numbers; list the others in notes."
    hints: [solicitation number, RFP number, bid number, PORFP number, reference number, project number]
  - name: Title
    group: overview_dates
    type: text
    question: "What is the full title of the bid or RFP (without its identifier numbers)?"
    hints: [title, request for proposal, solicitation title]
  - name: Due Date
    group: overview_dates
    type: datetime
    format: "YYYY-MM-DD HH:MM TZ"
    question: "What is the final proposal submission deadline, including time and time zone, after any addendum changes?"
    hints: [due date, closing date, solicitation due, proposal due, submission deadline, new due date]
  - name: Bid Submission Type
    group: overview_dates
    type: text
    question: "How must the bid be submitted (electronic portal, sealed paper, email, etc.)?"
    judge: true
    hints: [submission instructions, submitted online, electronic system, portal, sealed envelope, hard copy, not accepted by email]
  - name: Term of Bid
    group: overview_dates
    type: text
    question: "What is the contract duration and any renewal options?"
    judge: true
    hints: [term, initial term, renewal, length of contract, contract period, years]
  - name: Pre Bid Meeting
    group: overview_dates
    type: text
    question: "Is there a pre-bid / pre-proposal meeting? Give date, time, location, and whether attendance is mandatory; 'None' only if the documents say there is none."
    hints: [pre-bid, pre-proposal meeting, prebid conference, bidders conference, mandatory, attendance]
  - name: Delivery Date
    group: overview_dates
    type: text
    question: "What is the required delivery date or delivery window after award?"
    hints: [delivery, deliver within, days of award, ship date, lead time, delivered by]
  - name: Installation
    group: product_specs
    type: text
    question: "Are installation, deployment, imaging, or white-glove services required?"
    judge: true
    hints: [installation, deployment, imaging, white glove, etching, asset tag, decaling, setup]
  - name: Bid Bond Requirement
    group: commercial_legal
    type: text
    question: "Is a bid bond or bid security required? Give the amount or percentage; 'Not required' only if the documents say so."
    hints: [bid bond, bid security, proposal bond, surety, cashier's check, percent of bid]
  - name: Payment Terms
    group: commercial_legal
    type: text
    question: "What are the payment terms and invoicing conditions?"
    judge: true
    hints: [payment terms, net 30, invoice, invoicing instructions, accounts payable, payment]
  - name: Any Additional Documentation Required
    group: commercial_legal
    type: list
    question: "Which affidavits, forms, certificates, insurance or other documents must the bidder provide, with the proposal or later (e.g. upon award)? Say when each is due if the documents state it."
    hints: [affidavit, forms, W-9, W9, certificate, certificate of insurance, attachments, must be submitted, must provide, upon award, acknowledge addendum]
    exclude_doc_types: [affidavit, form]  # search what the solicitation requires, not the blank forms' own text
  - name: MFG for Registration
    group: commercial_legal
    type: text
    question: "Which manufacturer(s) must the bidder be registered or authorized with? If no manufacturer is named, state the manufacturer or reseller qualification the solicitation sets (for example a section that admits manufacturers or authorized resellers) and any certification it requires."
    hints: [manufacturer, authorized reseller, letter of authorization, OEM, factory-authorized]
  - name: Contract or Cooperative to use
    group: commercial_legal
    type: text
    question: "Which cooperative purchasing programs, interlocal agreements or state/master contract vehicles does the solicitation reference (including optional riders that let other entities buy from the resulting contract)?"
    hints: [cooperative, master contract, interlocal, piggyback, state contract, purchasing cooperative]
  - name: Model_no
    group: product_specs
    type: list
    question: "What manufacturer model names/numbers of the requested products are specified (e.g. a laptop or dock model)? Buyer item numbers and SKUs belong to Part_no; if the document labels them as model numbers, say so in notes."
    hints: [model, model number, "model #", product model, manufacturer model]
  - name: Part_no
    group: product_specs
    type: list
    question: "What part numbers, SKUs or buyer item numbers (e.g. 'SI#') of the requested products are specified?"
    hints: [part number, SKU, SI#, item number, catalog number, product code]
  - name: Product
    group: product_specs
    type: list
    question: "What product(s) are requested and in what quantities?"
    hints: [product name, quantity, qty, line item, price schedule, devices]
  - name: contact_info
    group: commercial_legal
    type: contact
    question: "Who is the procurement contact named in the solicitation (buyer or procurement officer: name, email, phone)? Put other contacts in notes."
    hints: [point of contact, POC, buyer, procurement officer, contact information, email, phone]
  - name: company_name
    group: commercial_legal
    type: text
    question: "What organization or agency is issuing this bid?"
    hints: [issuing organization, agency, district, department, office]
  - name: Product Specification
    group: product_specs
    type: text
    question: "What are the key technical specifications (CPU, RAM, storage, display, OS, warranty, etc.)?"
    judge: true
    hints: [specifications, processor, memory, RAM, storage, SSD, display, warranty, operating system]
  - name: Bid Summary
    group: summary
    type: summary
    question: "Write a concise 3-6 sentence summary of the bid."
    hints: []
